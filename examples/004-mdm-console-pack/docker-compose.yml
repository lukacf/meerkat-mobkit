name: mobkit-mdm-console

services:
  kennel-console:
    image: node:22-bookworm
    working_dir: /workspace/examples
    command:
      - bash
      - -lc
      - |
        npx --yes --package tsx@4.20.5 --package yaml@2.8.1 tsx 004-mdm-console-pack/run.ts --api-only --wait --api-listen 0.0.0.0:5788 --expect-targets 2
    environment:
      MDM_API_LISTEN_ADDR: 0.0.0.0:5788
    ports:
      - "5788:5788"
    volumes:
      - ../..:/workspace

  target-a:
    image: node:22-bookworm
    working_dir: /workspace/examples
    command:
      - bash
      - -lc
      - |
        npx --yes --package tsx@4.20.5 tsx 004-mdm-console-pack/src/targetd.ts --id target-a --name docker-target-a --site docker --platform linux-container --transport legacy --listen 0.0.0.0:5791 --advertise-url http://target-a:5791 --kennel http://kennel-console:5788 --allow-shell --state-dir /tmp/mdm-target-a
    depends_on:
      - kennel-console
    volumes:
      - ../..:/workspace

  target-b:
    image: node:22-bookworm
    working_dir: /workspace/examples
    command:
      - bash
      - -lc
      - |
        npx --yes --package tsx@4.20.5 tsx 004-mdm-console-pack/src/targetd.ts --id target-b --name docker-target-b --site docker --platform linux-container --transport control --listen 0.0.0.0:5792 --advertise-url http://target-b:5792 --kennel http://kennel-console:5788 --allow-shell --state-dir /tmp/mdm-target-b
    depends_on:
      - kennel-console
    volumes:
      - ../..:/workspace
