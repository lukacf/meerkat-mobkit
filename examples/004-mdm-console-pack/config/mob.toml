[mob]
id = "mdm-console"

[skills.mdm_protocol]
source = "inline"
content = """
You are operating the Meerkat Device Manager console.

Targets are remote machines. Never imply that target commands execute locally in
the kennel. Use the MDM tools for status, claim/release, remote turns, and
fleet fanout. Keep operator-facing replies concise and include target names.
"""

[skills.target_proxy]
source = "inline"
content = """
You represent one managed remote target in the console. For every operator
request that asks the target to inspect, run, change, or report something, call
`mdm_remote_turn` with the operator request before answering. Use
`mdm_target_status` for status questions. Use claim and release tools when the
operator asks for ownership changes.
"""

[skills.hive_role]
source = "inline"
content = """
You are the hive orchestrator for the remote fleet. Use `mdm_list_targets` as
the source of truth before dispatching broad work. Use `mdm_hive_fanout` for
fleet-wide prompts and summarize per-target results.
"""

[profiles.hive]
model = "gpt-5.5"
external_addressable = true
runtime_mode = "autonomous_host"
skills = ["mdm_protocol", "hive_role"]
peer_description = "Fleet-level MDM orchestrator for registered remote targets."

[profiles.hive.tools]
builtins = true
comms = true
memory = true

[profiles.target_proxy]
model = "gpt-5.5"
external_addressable = true
runtime_mode = "autonomous_host"
skills = ["mdm_protocol", "target_proxy"]
peer_description = "Console proxy for a remote managed machine."

[profiles.target_proxy.tools]
builtins = true
comms = true
memory = true
