[package]
name = "meerkat-mobkit"
description = "Companion orchestration platform for the Meerkat multi-agent runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
uuid = { version = "1", features = ["v5"] }
schemars = "1.2.1"
toml = "0.8"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
bytes = "1"
hmac = "0.12"
sha2 = "0.10"
ring = "0.17"
# Ed25519 keypair for cross-process gateway peering. Pulled in transitively
# via meerkat-comms; declared directly here so mobkit's `auth::peer_keys`
# can mint and persist gateway signing keys without crossing the meerkat
# crate seam. Keep features minimal — `std` for `OsRng`, `rand_core` so
# we can call `SigningKey::generate`.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", default-features = false, features = ["std"] }
chrono = "0.4"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "process", "io-util", "io-std", "signal", "macros", "net", "time"] }
axum = { version = "0.8", features = ["json", "multipart"] }
tower = { version = "0.5", features = ["limit"] }
async-stream = "0.3"
form_urlencoded = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
futures = "0.3"
fs2 = "0.4"
object_store = { version = "0.13", features = ["fs"] }
meerkat-core = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86" }
meerkat-client = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86" }
meerkat-comms = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86" }
meerkat-contracts = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86" }
meerkat-mob = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86" }
meerkat-mob-mcp = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86" }
meerkat-mcp = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86" }
meerkat-models = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86" }
# Meerkat split session memory out of `memory-store` (which now only maps
# to meerkat-store/memory); explicit `memory` enables need `memory-store-session`.
meerkat = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86", features = ["comms", "skills", "mcp", "memory-store", "memory-store-session", "jsonl-store", "session-store", "sqlite-store", "live", "openai-realtime"] }
meerkat-openai = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86", optional = true }
# READ-ONLY host-side access to meerkat's OWN session semantic memory for the
# Distiller's post-compaction harvest (§8.4: `MemoryStore::search` over the
# discard range). This reads meerkat's store; the §12 bright line governs the
# bundled agent-memory store, which stays plain B-tree SQLite.
meerkat-memory = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86" }
# Live (realtime) member sessions: `live_wiring` hosts the projection sink,
# the WS transport state, and the mobkit/live/* handlers on top of this crate.
meerkat-live = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86" }
meerkat-runtime = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86", features = ["sqlite-store", "live"] }
meerkat-session = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86", features = ["session-store"] }
# Shared SQLite mechanics (storage-unification): named connection profiles,
# the per-file migration ledger, per-operation maintenance fence guards
# (every in-crate opener, M3), and the doctor's read-only ledger reads (M1).
meerkat-sqlite = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86" }
# `memory` is the parked-delta backend for pre-registration incremental
# writes in the continuity adapter (nothing parked is ever durable).
meerkat-store = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86", features = ["sqlite", "memory"] }
meerkat-tools = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86" }
tempfile = "3"
async-trait = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
integration-real-tests = []
# Forwarding edge, valid only now that the bound Meerkat carries the feature.
# The packet deliberately shipped this as an EMPTY placeholder because cargo
# validates dependency feature names even when the feature is unselected, so
# forwarding it against 0.8.29 would have broken every default build.
experimental-gpt-live = [
    "meerkat/experimental-gpt-live",
    "meerkat-mob/experimental-gpt-live",
    "meerkat-mob-mcp/experimental-gpt-live",
    # Optional dependency: `?` forwards the feature WITHOUT enabling the
    # dependency itself, so an experimental build does not silently pull in
    # the OpenAI provider for consumers that never asked for it.
    "meerkat-openai?/experimental-gpt-live",
]
# Non-shipping cross-crate lifecycle tests may mint only the upstream test
# profile selection. Production experimental builds do not enable this.
experimental-gpt-live-test = [
    "experimental-gpt-live",
    "meerkat-runtime/test-support",
]
# Pre-release integration note: the upstream feature-forwarding edges are
# added only after the Meerkat release carrying `experimental-gpt-live` is
# published. Cargo validates dependency feature names even when this feature
# is not selected, so forwarding them while the workspace remains pinned to
# 0.8.28 would break every default build. The implementation is validated in
# development with an ephemeral local patch and ephemeral forwarding edges;
# neither belongs in the committed portable manifest.
# Test-only outer-boundary mechanics for offline realtime integration fixtures.
# This never supplies admission, binding, lease, or provider authority.
test-realtime-fixtures = [
    "experimental-gpt-live",
]
# Calibration-harness seam for the memory Distiller (§8.4/§11); same contract
# as the other calibration bins, fixture in / structured ops out.
# `scripts/memory-evals --mode live` drives these binaries per fixture. Each is
# named explicitly so the CLI name is hyphenated.
[[bin]]
name = "distiller-eval"
path = "src/bin/distiller_eval.rs"

# Calibration-harness seam for the memory Steward's consolidate phase
# (§8.5/§11): fixture in / mapped ops + staged-validator verdict out.
[[bin]]
name = "steward-eval"
path = "src/bin/steward_eval.rs"

# Calibration-harness seam for the memory Hygienist (§8.6/§11): fixture in /
# parsed ops + §8.6 revision-validator verdict out.
[[bin]]
name = "hygienist-eval"
path = "src/bin/hygienist_eval.rs"

[[example]]
name = "incident_command_center"
path = "../examples/001-incident-command-center-pack/server.rs"

[[example]]
name = "mdm_mob_target"
path = "../examples/004-mdm-console-pack/target.rs"

[[example]]
name = "access_control_console"
path = "../examples/005-access-control-pack/server.rs"

[dev-dependencies]
serde_json = "1"
# Process CPU-time deltas (never wall clock) for the idle-CPU regression
# gate (tests/idle_cpu_gate.rs); safe wrapper because unsafe_code is forbidden.
cpu-time = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
jsonwebtoken = "9"
async-trait = "0.1"
meerkat-schedule = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86" }
# `schema` feature (test-only) exposes `meerkat_mob::adaptive::layer_decision_schema()`
# so a parity guard can assert the bundled adaptive layer-decision schema stays
# Value-equal to meerkat's canonical one. Dev-dependency: not enabled in release
# builds, so the production binary keeps the lean (no-schemars) meerkat-mob.
meerkat-mob = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86", features = ["schema"] }
# `test-realtime-fixtures` (test-only) exposes meerkat's shared
# ScriptedRealtimeSessionFactory so the live-open cross-provider regression
# tests (tests/gateway_live.rs) can observe the exact channel identity handed
# to the provider lane without a provider socket or credential.
meerkat = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86", features = ["test-realtime-fixtures"] }
meerkat-providers = { version = "=0.8.30", git = "https://github.com/lukacf/meerkat.git", rev = "e9526278c82627b8c8be381ec71cdef4b844db86" }
