# nextest configuration.
#
# `heavy-runtime`: full-`UnifiedRuntime`-boot integration binaries that each
# spin a complete mob (actors + comms + ephemeral sessions + background drain
# tasks) and then tear it down. Run enough of them at once and the async
# teardown — mob stop, event drain, RPC round-trips on tight (1-2s) timeouts —
# gets starved of CPU on a loaded runner and times out, so the tests fail on
# *teardown* assertions (e.g. list_runs.rs:257 `shutdown.mob_stop.is_ok()`)
# despite the behavior under test being correct. They pass 1/1 in isolation.
#
# Two levers, because the starvation is driven by AGGREGATE suite load (the whole
# ~28-binary integration suite competing for CPU), not just co-running group
# members:
#   1. max-threads caps how many of these heavyweight tests co-run.
#   2. retries let a test that lost the teardown-timeout race under peak load
#      re-run — by which point most of the suite has finished, so the retry runs
#      near-alone and the teardown completes. This is the canonical nextest
#      answer for a load-timeout flake that passes 1/1 in isolation, and it is
#      scoped to THIS family only (via the override), so no non-family test's
#      intermittent failure is ever masked.
# Neither weakens an assertion or a production timeout. This replaces the per-PR
# "triage the list_runs/contract_009/run_flow/projected_cursor flake by running
# it standalone" ritual with a structural fix.

[test-groups]
heavy-runtime = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'package(meerkat-mobkit) & (binary(routing_delivery) + binary(list_runs) + binary(list_flows_run_flow) + binary(mob_events_cursor_persistence) + binary(mob_events_query_ledger) + binary(mob_events_streaming) + binary(access_control) + binary(unified_console))'
test-group = 'heavy-runtime'
retries = 2

# `access_control` joined the family 2026-07-09: its tests each boot a full
# reference-app runtime, and under peak suite load on 4-core CI runners two
# consecutive runs ABORTED with SIGBUS (~test 1020/1624, different tests each
# time, 119GB disk free, passes 1/1 isolated and in the sibling same-commit
# run) — the same aggregate-load starvation family expressed as a crash
# rather than a teardown timeout. Retries re-run in a fresh process near-alone;
# a deterministic crash would still fail all three attempts.

# `unified_console` joined 2026-07-10: its live-snapshot test SIG10-aborted
# twice on loaded 16-core local full-suite runs (passes 1/1 isolated and in
# its binary) — same aggregate-load crash family as access_control.

# The console-aggregator burst test races a deliberately-slow backfill against
# live frames; under peak suite load the burst window starves the same way the
# heavy-runtime family does (passes 1/1 isolated). Same scoped remedy.
#
# `refresh_session_history_parallelizes_slow_member_backfills_at_scale` joined
# 2026-07-28: it proves concurrency by WALL CLOCK — 32 members each delayed
# 40ms, asserting the parallel path finishes under 600ms against a 1280ms
# serial baseline. That inference only holds while the runner actually has
# cores to spare; on a loaded 4-core CI runner 32 "parallel" backfills
# serialize on CPU and the elapsed time measures contention, not a regression
# in the code under test. Passes 1/1 isolated, failed once in a full-suite CI
# run at HEAD of this PR. Retries re-run it near-alone, which is when its
# premise is true.
#
# Noted honestly rather than silently: widening the 600ms bound was the other
# option and would have weakened a real assertion to buy a green run. A
# wall-clock parallelism proof is load-sensitive by construction, so the right
# long-term shape is to assert interleaving evidence (observed concurrent
# read_calls) instead of elapsed time. Not done here — that is test-design
# work, not release work.
[[profile.default.overrides]]
filter = 'package(meerkat-mobkit) & (test(live_event_burst_reaches_store_while_slow_backfill_is_running) + test(refresh_session_history_parallelizes_slow_member_backfills_at_scale))'
retries = 2
