name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release_packages:
        description: "Publish Rust/Python/TypeScript artifacts to registries"
        required: false
        default: false
        type: boolean
      registry_dry_run:
        description: "Run registry publish steps in dry-run mode"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Existing release tag to use for manual GitHub asset publication"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

# Required GitHub Actions secrets for full release:
#   CARGO_REGISTRY_TOKEN  - crates.io API token
#   PYPI_API_TOKEN        - PyPI API token (scoped to meerkat-mobkit package)
#   NPM_TOKEN             - npm access token (scoped to @rkat org)
#   DOCS_PUBLISH_TOKEN    - fine-grained token with Contents: write on lukacf/meerkat;
#                           used only to dispatch the docs-owner workflow

jobs:
  release_validate:
    name: Validate release state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install console dependencies
        run: npm --prefix console ci --silent --no-fund --no-audit

      - name: Verify embedded console bundle freshness
        run: npm --prefix console run embedded:freshness --silent

      - name: Verify version parity
        run: make verify-version-parity

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: make verify-version

      - name: Verify requested release tag matches version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        run: |
          set -euo pipefail
          version=$(scripts/repo-cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "meerkat-mobkit") | .version')
          tag="${{ github.event.inputs.release_tag }}"
          tag="${tag#v}"
          if [[ "$version" != "$tag" ]]; then
            echo "Version mismatch: Cargo.toml has $version but requested release tag is $tag" >&2
            exit 1
          fi
          echo "Version $version matches requested release tag"

      - name: Validate manual publication inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          PUBLISH_PACKAGES: ${{ github.event.inputs.publish_release_packages }}
          REGISTRY_DRY_RUN: ${{ github.event.inputs.registry_dry_run }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_PACKAGES" == "true" && "$REGISTRY_DRY_RUN" != "true" && -z "$RELEASE_TAG" ]]; then
            echo "::error::A non-dry-run registry publication requires release_tag so the complete binary matrix can be built and verified first." >&2
            exit 1
          fi

      - name: Check formatting
        run: make fmt-check

  build_binaries:
    name: Build gateway binaries (${{ matrix.target }})
    needs: [release_validate]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    # Migrated off the self-hosted BuildBuddy/GCP infra to GitHub-hosted runners
    # (mirrors meerkat's release build): each target builds natively on its own
    # runner with plain cargo — no bazel, no BuildBuddy, no self-hosted runner.
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
          - runs-on: macos-15
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - runs-on: macos-15-large
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Apply release build profile overrides
        shell: bash
        # The binary build checks out the RELEASE TAG, so Cargo.toml profile
        # fixes on main don't reach re-dispatched builds of older tags. The
        # opt-0 overrides for the meerkat mega-crates (see the workspace
        # Cargo.toml rationale: single enormous rustc/LLVM invocations that
        # OOM 7-16 GB hosted runners at opt-level 1) are therefore ALSO
        # injected here, idempotently, so any tag builds with them.
        run: |
          set -euo pipefail
          for crate in meerkat-core meerkat-runtime meerkat-mob meerkat-live; do
            if ! grep -q "profile.release.package.${crate}]" Cargo.toml; then
              printf '\n[profile.release.package.%s]\nopt-level = 0\n' "$crate" >> Cargo.toml
              echo "injected opt-0 profile for ${crate}"
            fi
          done

      - name: Build gateway binaries
        shell: bash
        env:
          CARGO_TARGET_DIR: target
          # Bound rustc parallelism: the meerkat mega-crates (meerkat-mob,
          # meerkat-runtime, meerkat-mobkit lib) each drive LLVM into multiple
          # GB; at default -j on 16 GB hosted runners the Windows leg dies
          # with "rustc-LLVM ERROR: out of memory" and the Linux legs get
          # OOM-killed (surfacing as "runner received a shutdown signal",
          # exit 143) — v0.7.22's first matrix run lost 3/5 legs to this.
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          # Build BOTH gateways for this target with plain cargo. (The repo-cargo
          # wrapper redirects CARGO_TARGET_DIR for dev-worktree isolation; a clean
          # release runner wants the predictable ./target path.) rpc_gateway is the
          # SDK stdin-RPC gateway; mobkit_gateway is the console/HTTP one — SDK
          # users need rpc_gateway, so both ship.
          # --locked: the binaries we ship must be built from the SAME
          # dependency set the audit lane checked. Without it cargo is
          # permitted to resolve differently from the committed lock, so a
          # green `cargo deny` would be a measurement of the source while the
          # published artifact carried something else. RUSTSEC-2026-0258 made
          # that distinction concrete: adopters running a prebuilt gateway are
          # exposed by what is IN THE BINARY, not by what the lock says.
          cargo build -p meerkat-mobkit --bin mobkit_gateway --bin rpc_gateway --bin mobkit_repair \
            --locked --release --target "${{ matrix.target }}"

      - name: Ad-hoc codesign macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for bin in mobkit_gateway rpc_gateway mobkit_repair; do
            codesign --force --sign - "target/${{ matrix.target }}/release/${bin}"
          done

      - name: Package artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"; VERSION="${VERSION//\//-}"
          mkdir -p dist
          # cargo bin name -> published archive prefix
          BINS=("mobkit_gateway:mobkit-gateway" "rpc_gateway:mobkit-rpc-gateway" "mobkit_repair:mobkit-repair")
          for entry in "${BINS[@]}"; do
            bin="${entry%%:*}"; prefix="${entry##*:}"
            if [[ "${RUNNER_OS}" == "Windows" ]]; then
              src="target/${TARGET}/release/${bin}.exe"
            else
              src="target/${TARGET}/release/${bin}"
            fi
            if [[ ! -f "$src" ]]; then
              echo "::error::missing expected binary at $src" >&2
              exit 1
            fi
            artifact="${prefix}-${VERSION}-${TARGET}.${ARCHIVE_EXT}"
            if [[ "$ARCHIVE_EXT" == "zip" ]]; then
              7z a -tzip "dist/${artifact}" "$(cygpath -w "$src")" >/dev/null
            else
              tar -czf "dist/${artifact}" -C "$(dirname "$src")" "$(basename "$src")"
            fi
            if [[ ! -s "dist/${artifact}" ]]; then
              echo "::error::archive dist/${artifact} missing or empty" >&2
              exit 1
            fi
            echo "packaged dist/${artifact}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobkit-gateway-binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish_github_release:
    name: Publish GitHub release assets
    if: >-
      success() &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''))
    needs: [build_binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare complete flat release asset set
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          python3 scripts/verify-release-assets.py prepare \
            --source-dir release-artifacts \
            --output-dir release-assets \
            --release-tag "$RELEASE_TAG"

      - name: Verify release manifest, checksums, and asset names
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/verify-release-assets.py verify \
            --assets-dir release-assets \
            --release-tag "$RELEASE_TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/checksums.sha256
            release-assets/index.json
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true

  publish_registries:
    name: Publish crate + SDK packages
    if: >-
      always() &&
      needs.release_validate.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release_packages == 'true')) &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.registry_dry_run == 'true') ||
       (needs.build_binaries.result == 'success' && needs.publish_github_release.result == 'success'))
    needs: [release_validate, build_binaries, publish_github_release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install Python + Node tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python publishing tools
        run: python -m pip install --upgrade build twine

      - name: Publish Rust crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.registry_dry_run == 'true' }}"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Running cargo publish in dry-run mode"
            scripts/repo-cargo publish -p meerkat-mobkit --locked --dry-run
          else
            echo "Publishing meerkat-mobkit to crates.io"
            output=$(scripts/repo-cargo publish -p meerkat-mobkit --locked 2>&1) && true
            rc=$?
            if [[ $rc -eq 0 ]]; then
              echo "  meerkat-mobkit: published"
            elif echo "$output" | grep -q "already exists\|already uploaded"; then
              echo "  meerkat-mobkit: already published, skipping"
            else
              echo "$output" >&2
              exit $rc
            fi
          fi

      - name: Publish Python SDK
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        working-directory: sdk/python
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.registry_dry_run == 'true' }}"
          python -m pip install --upgrade build twine
          rm -rf dist
          python -m build
          python -m twine check dist/*
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Python SDK dry-run: skipping upload"
          else
            python -m twine upload --skip-existing dist/*
          fi

      - name: Publish TypeScript SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.registry_dry_run == 'true' }}"
          npm install --ignore-scripts
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm run build
          if [[ "$DRY_RUN" == "true" ]]; then
            npm publish --access public --dry-run
          else
            PACKAGE_NAME=$(node -p "require('./package.json').name")
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            PACKAGE_SPEC="${PACKAGE_NAME}@${PACKAGE_VERSION}"
            VIEW_STDERR=$(mktemp)
            trap 'rm -f "$VIEW_STDERR"' EXIT

            if PUBLISHED_VERSION=$(npm view "$PACKAGE_SPEC" version --registry=https://registry.npmjs.org/ 2>"$VIEW_STDERR"); then
              if [[ "$PUBLISHED_VERSION" != "$PACKAGE_VERSION" ]]; then
                echo "::error::npm returned unexpected version '$PUBLISHED_VERSION' for exact package spec '$PACKAGE_SPEC'." >&2
                exit 1
              fi
              echo "  $PACKAGE_SPEC: already published, skipping"
            else
              VIEW_STATUS=$?
              if grep -Eq '(^|[[:space:]])E404([[:space:]]|$)' "$VIEW_STDERR"; then
                echo "Publishing $PACKAGE_SPEC to npm"
                npm publish --access public
              else
                cat "$VIEW_STDERR" >&2
                exit "$VIEW_STATUS"
              fi
            fi
          fi

      - name: Verify exact packages are public on every registry
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.registry_dry_run != 'true'
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python scripts/verify-published-registries.py --version "$VERSION"

  publish_docs:
    name: Publish released documentation
    if: >-
      always() &&
      needs.publish_github_release.result == 'success' &&
      needs.publish_registries.result == 'success' &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.registry_dry_run != 'true')
    needs: [publish_github_release, publish_registries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Dispatch docs.rkat.ai publication
        env:
          GH_TOKEN: ${{ secrets.DOCS_PUBLISH_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::DOCS_PUBLISH_TOKEN is required to publish released docs" >&2
            exit 1
          fi

          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          tag_version="${RELEASE_TAG#v}"
          if [[ "$version" != "$tag_version" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match MobKit version $version" >&2
            exit 1
          fi
          release_sha=$(git rev-parse HEAD)

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$release_sha" \
            --arg version "$version" \
            '{
              event_type: "mobkit-release-published",
              client_payload: {
                tag: $tag,
                sha: $sha,
                version: $version
              }
            }' | gh api --method POST repos/lukacf/meerkat/dispatches --input -
