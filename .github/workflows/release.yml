name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release_packages:
        description: "Publish Rust/Python/TypeScript artifacts to registries"
        required: false
        default: false
        type: boolean
      registry_dry_run:
        description: "Run registry publish steps in dry-run mode"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Existing release tag to use for manual GitHub asset publication"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

# Required GitHub Actions secrets for full release:
#   CARGO_REGISTRY_TOKEN  - crates.io API token
#   PYPI_API_TOKEN        - PyPI API token (scoped to meerkat-mobkit package)
#   NPM_TOKEN             - npm access token (scoped to @rkat org)

jobs:
  release_validate:
    name: Validate release state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install console dependencies
        run: npm --prefix console ci --silent --no-fund --no-audit

      - name: Verify embedded console bundle freshness
        run: npm --prefix console run embedded:freshness --silent

      - name: Verify version parity
        run: make verify-version-parity

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: make verify-version

      - name: Verify requested release tag matches version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        run: |
          set -euo pipefail
          version=$(scripts/repo-cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "meerkat-mobkit") | .version')
          tag="${{ github.event.inputs.release_tag }}"
          tag="${tag#v}"
          if [[ "$version" != "$tag" ]]; then
            echo "Version mismatch: Cargo.toml has $version but requested release tag is $tag" >&2
            exit 1
          fi
          echo "Version $version matches requested release tag"

      - name: Check formatting
        run: make fmt-check

  build_binaries:
    name: Build gateway binaries (${{ matrix.target }})
    needs: [release_validate]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    # Migrated off the self-hosted BuildBuddy/GCP infra to GitHub-hosted runners
    # (mirrors meerkat's release build): each target builds natively on its own
    # runner with plain cargo — no bazel, no BuildBuddy, no self-hosted runner.
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
          - runs-on: macos-15
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - runs-on: macos-15-large
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build gateway binaries
        shell: bash
        env:
          CARGO_TARGET_DIR: target
          # Bound rustc parallelism: the meerkat mega-crates (meerkat-mob,
          # meerkat-runtime, meerkat-mobkit lib) each drive LLVM into multiple
          # GB; at default -j on 16 GB hosted runners the Windows leg dies
          # with "rustc-LLVM ERROR: out of memory" and the Linux legs get
          # OOM-killed (surfacing as "runner received a shutdown signal",
          # exit 143) — v0.7.22's first matrix run lost 3/5 legs to this.
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          # Build BOTH gateways for this target with plain cargo. (The repo-cargo
          # wrapper redirects CARGO_TARGET_DIR for dev-worktree isolation; a clean
          # release runner wants the predictable ./target path.) rpc_gateway is the
          # SDK stdin-RPC gateway; mobkit_gateway is the console/HTTP one — SDK
          # users need rpc_gateway, so both ship.
          cargo build -p meerkat-mobkit --bin mobkit_gateway --bin rpc_gateway \
            --release --target "${{ matrix.target }}"

      - name: Ad-hoc codesign macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for bin in mobkit_gateway rpc_gateway; do
            codesign --force --sign - "target/${{ matrix.target }}/release/${bin}"
          done

      - name: Package artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"; VERSION="${VERSION//\//-}"
          mkdir -p dist
          # cargo bin name -> published archive prefix
          BINS=("mobkit_gateway:mobkit-gateway" "rpc_gateway:mobkit-rpc-gateway")
          for entry in "${BINS[@]}"; do
            bin="${entry%%:*}"; prefix="${entry##*:}"
            if [[ "${RUNNER_OS}" == "Windows" ]]; then
              src="target/${TARGET}/release/${bin}.exe"
            else
              src="target/${TARGET}/release/${bin}"
            fi
            if [[ ! -f "$src" ]]; then
              echo "::error::missing expected binary at $src" >&2
              exit 1
            fi
            artifact="${prefix}-${VERSION}-${TARGET}.${ARCHIVE_EXT}"
            if [[ "$ARCHIVE_EXT" == "zip" ]]; then
              7z a -tzip "dist/${artifact}" "$(cygpath -w "$src")" >/dev/null
            else
              tar -czf "dist/${artifact}" -C "$(dirname "$src")" "$(basename "$src")"
            fi
            if [[ ! -s "dist/${artifact}" ]]; then
              echo "::error::archive dist/${artifact} missing or empty" >&2
              exit 1
            fi
            echo "packaged dist/${artifact}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobkit-gateway-binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish_github_release:
    name: Publish GitHub release assets
    # always(): the build matrix is fail-fast:false, so publish whatever targets
    # succeeded even if one (e.g. a flaky runner) failed — the checksum step
    # still fails loudly if NOTHING built.
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''))
    needs: [build_binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Build checksum manifest
        working-directory: release-artifacts
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) | sort > manifest_files.txt
          if [[ ! -s manifest_files.txt ]]; then
            echo "No release artifacts found" >&2
            exit 1
          fi
          xargs sha256sum < manifest_files.txt > checksums.sha256
          python3 - <<'PY'
          import os
          import json
          from pathlib import Path

          paths = [
              p.as_posix().lstrip("./")
              for p in sorted(Path(".").rglob("*"))
              if p.is_file() and (p.name.endswith(".tar.gz") or p.name.endswith(".zip"))
          ]

          tag = os.environ["RELEASE_TAG"]
          manifest = {
              "version": tag.lstrip("v"),
              "tag": tag,
              "artifacts": paths,
              "checksums": "checksums.sha256",
          }

          with open("index.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          PY

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
            release-artifacts/checksums.sha256
            release-artifacts/index.json
          draft: false
          # false: a missing target class (e.g. no Windows zip if that leg
          # failed) must not block shipping the binaries that did build.
          fail_on_unmatched_files: false
          generate_release_notes: true

  publish_registries:
    name: Publish crate + SDK packages
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release_packages == 'true')
    needs: [release_validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install Python + Node tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python publishing tools
        run: python -m pip install --upgrade build twine

      - name: Publish Rust crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.registry_dry_run == 'true' }}"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Running cargo publish in dry-run mode"
            scripts/repo-cargo publish -p meerkat-mobkit --locked --dry-run
          else
            echo "Publishing meerkat-mobkit to crates.io"
            output=$(scripts/repo-cargo publish -p meerkat-mobkit --locked 2>&1) && true
            rc=$?
            if [[ $rc -eq 0 ]]; then
              echo "  meerkat-mobkit: published"
            elif echo "$output" | grep -q "already exists\|already uploaded"; then
              echo "  meerkat-mobkit: already published, skipping"
            else
              echo "$output" >&2
              exit $rc
            fi
          fi

      - name: Publish Python SDK
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        working-directory: sdk/python
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.registry_dry_run == 'true' }}"
          python -m pip install --upgrade build twine
          rm -rf dist
          python -m build
          python -m twine check dist/*
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Python SDK dry-run: skipping upload"
          else
            python -m twine upload --skip-existing dist/*
          fi

      - name: Publish TypeScript SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.registry_dry_run == 'true' }}"
          npm install --ignore-scripts
          npm config set //registry.npmjs.org/:_authToken ${NODE_AUTH_TOKEN}
          npm run build
          if [[ "$DRY_RUN" == "true" ]]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
