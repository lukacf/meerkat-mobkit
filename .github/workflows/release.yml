name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release_packages:
        description: "Publish Rust/Python/TypeScript artifacts to registries"
        required: false
        default: false
        type: boolean
      registry_dry_run:
        description: "Run registry publish steps in dry-run mode"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Existing release tag to use for manual GitHub asset publication"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

# Required GitHub Actions secrets for full release:
#   CARGO_REGISTRY_TOKEN  - crates.io API token
#   PYPI_API_TOKEN        - PyPI API token (scoped to meerkat-mobkit package)
#   NPM_TOKEN             - npm access token (scoped to @rkat org)

jobs:
  release_validate:
    name: Validate release state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install console dependencies
        run: npm --prefix console ci --silent --no-fund --no-audit

      - name: Verify embedded console bundle freshness
        run: npm --prefix console run embedded:freshness --silent

      - name: Verify version parity
        run: make verify-version-parity

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: make verify-version

      - name: Verify requested release tag matches version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        run: |
          set -euo pipefail
          version=$(scripts/repo-cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "meerkat-mobkit") | .version')
          tag="${{ github.event.inputs.release_tag }}"
          tag="${tag#v}"
          if [[ "$version" != "$tag" ]]; then
            echo "Version mismatch: Cargo.toml has $version but requested release tag is $tag" >&2
            exit 1
          fi
          echo "Version $version matches requested release tag"

      - name: Check formatting
        run: make fmt-check

  build_binaries:
    name: Build gateway binary (${{ matrix.target }})
    needs: [release_validate]
    runs-on: ${{ matrix.runs-on }}
    # CARGO_TARGET_DIR is pinned to a fixed in-workspace `target/` (instead of
    # repo-cargo's per-worktree cache dir) so Swatinem/rust-cache can find and
    # cache the build. The repo's .cargo/config.toml (RUST_MIN_STACK) still
    # applies since cargo reads it from the repo root.
    env:
      CARGO_TARGET_DIR: target
    strategy:
      fail-fast: false
      matrix:
        # The heavy Linux x86_64 build runs on the reused meerkat self-hosted
        # runner (32-core / 128 GB) with sccache + full parallelism: no OOM and a
        # warm cross-release cache. Other targets stay GitHub-hosted — macOS on
        # larger paid runners (-j2 fits 30 GB), and the 16 GB Linux-arm / Windows
        # runners at -j1 (a hard memory cap: meerkat-machine-schema is ~5.8 GB at
        # opt-0 and several meerkat crates are multi-GB, so higher -j OOMs 16 GB).
        include:
          - runs-on: ["self-hosted", "mobkit-temp-linux"]
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            self_hosted: true
          - runs-on: ["ubuntu-24.04-arm"]
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            jobs: 1
          - runs-on: ["macos-15-xlarge"]
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            jobs: 2
          - runs-on: ["macos-15-large"]
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            jobs: 2
          - runs-on: ["windows-latest"]
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            jobs: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Self-hosted runner already has the rustc-stable toolchain + sccache on
      # PATH (it mirrors meerkat's runner env) and caches via sccache, so it skips
      # the toolchain install / target add / Actions cache that GitHub-hosted needs.
      - name: Install Rust
        if: ${{ !matrix.self_hosted }}
        uses: dtolnay/rust-toolchain@stable

      - name: Add release target
        if: ${{ !matrix.self_hosted }}
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo build
        if: ${{ !matrix.self_hosted }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build gateway binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.self_hosted }}" == "true" ]]; then
            # 32-core / 128 GB self-hosted runner: full parallelism (no OOM) +
            # sccache against the VM's persistent local cache for warm builds.
            export RUSTC_WRAPPER=/usr/local/bin/sccache
            export CARGO_INCREMENTAL=0
            cargo build -p meerkat-mobkit --bin mobkit_gateway --release --target "${{ matrix.target }}"
            /usr/local/bin/sccache --show-stats || true
          else
            # GitHub-hosted: -j is a hard memory cap — meerkat-machine-schema is
            # ~5.8 GB at opt-0 and several meerkat crates are multi-GB, so higher
            # -j OOMs the 16 GB runners.
            cargo build -p meerkat-mobkit --bin mobkit_gateway --release --target "${{ matrix.target }}" -j ${{ matrix.jobs }}
          fi

      - name: Package artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          BINARIES=("mobkit_gateway")
          mkdir -p dist
          target_dir="${CARGO_TARGET_DIR:-target}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION//\//-}"

          for bin in "${BINARIES[@]}"; do
            if [[ "${RUNNER_OS}" == "Windows" ]]; then
              src="${target_dir}/${TARGET}/release/${bin}.exe"
            else
              src="${target_dir}/${TARGET}/release/${bin}"
            fi
            artifact_name="mobkit-gateway-${VERSION}-${TARGET}.${ARCHIVE_EXT}"

            if [[ ! -f "$src" ]]; then
              echo "Missing expected binary at $src" >&2
              exit 1
            fi

            if [[ "$ARCHIVE_EXT" == "zip" ]]; then
              7z a -tzip "${GITHUB_WORKSPACE}/dist/${artifact_name}" "$(cygpath -w "$src")"
            else
              tar -czf "dist/${artifact_name}" -C "$(dirname "$src")" "$(basename "$src")"
            fi
            echo "packaged=${bin} -> dist/${artifact_name}"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobkit-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish_github_release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    needs: [build_binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Build checksum manifest
        working-directory: release-artifacts
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) | sort > manifest_files.txt
          if [[ ! -s manifest_files.txt ]]; then
            echo "No release artifacts found" >&2
            exit 1
          fi
          xargs sha256sum < manifest_files.txt > checksums.sha256
          python3 - <<'PY'
          import os
          import json
          from pathlib import Path

          paths = [
              p.as_posix().lstrip("./")
              for p in sorted(Path(".").rglob("*"))
              if p.is_file() and (p.name.endswith(".tar.gz") or p.name.endswith(".zip"))
          ]

          tag = os.environ["RELEASE_TAG"]
          manifest = {
              "version": tag.lstrip("v"),
              "tag": tag,
              "artifacts": paths,
              "checksums": "checksums.sha256",
          }

          with open("index.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          PY

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
            release-artifacts/checksums.sha256
            release-artifacts/index.json
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true

  publish_registries:
    name: Publish crate + SDK packages
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release_packages == 'true')
    needs: [release_validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install Python + Node tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python publishing tools
        run: python -m pip install --upgrade build twine

      - name: Publish Rust crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.registry_dry_run == 'true' }}"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Running cargo publish in dry-run mode"
            scripts/repo-cargo publish -p meerkat-mobkit --locked --dry-run
          else
            echo "Publishing meerkat-mobkit to crates.io"
            output=$(scripts/repo-cargo publish -p meerkat-mobkit --locked 2>&1) && true
            rc=$?
            if [[ $rc -eq 0 ]]; then
              echo "  meerkat-mobkit: published"
            elif echo "$output" | grep -q "already exists\|already uploaded"; then
              echo "  meerkat-mobkit: already published, skipping"
            else
              echo "$output" >&2
              exit $rc
            fi
          fi

      - name: Publish Python SDK
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        working-directory: sdk/python
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.registry_dry_run == 'true' }}"
          python -m pip install --upgrade build twine
          rm -rf dist
          python -m build
          python -m twine check dist/*
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Python SDK dry-run: skipping upload"
          else
            python -m twine upload --skip-existing dist/*
          fi

      - name: Publish TypeScript SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.registry_dry_run == 'true' }}"
          npm install --ignore-scripts
          npm config set //registry.npmjs.org/:_authToken ${NODE_AUTH_TOKEN}
          npm run build
          if [[ "$DRY_RUN" == "true" ]]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
