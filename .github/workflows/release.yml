name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release_packages:
        description: "Publish Rust/Python/TypeScript artifacts to registries"
        required: false
        default: false
        type: boolean
      registry_dry_run:
        description: "Run registry publish steps in dry-run mode"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Existing release tag to use for manual GitHub asset publication"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

# Required GitHub Actions secrets for full release:
#   CARGO_REGISTRY_TOKEN  - crates.io API token
#   PYPI_API_TOKEN        - PyPI API token (scoped to meerkat-mobkit package)
#   NPM_TOKEN             - npm access token (scoped to @rkat org)

jobs:
  release_validate:
    name: Validate release state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install console dependencies
        run: npm --prefix console ci --silent --no-fund --no-audit

      - name: Verify embedded console bundle freshness
        run: npm --prefix console run embedded:freshness --silent

      - name: Verify version parity
        run: make verify-version-parity

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: make verify-version

      - name: Verify requested release tag matches version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        run: |
          set -euo pipefail
          version=$(scripts/repo-cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "meerkat-mobkit") | .version')
          tag="${{ github.event.inputs.release_tag }}"
          tag="${tag#v}"
          if [[ "$version" != "$tag" ]]; then
            echo "Version mismatch: Cargo.toml has $version but requested release tag is $tag" >&2
            exit 1
          fi
          echo "Version $version matches requested release tag"

      - name: Check formatting
        run: make fmt-check

  build_binaries:
    name: Build gateway binaries (BuildBuddy RBE)
    needs: [release_validate]
    # Self-hosted runner has bb (BuildBuddy CLI) + the toolchain; the actual
    # compiles run on hosted-BuildBuddy RBE (linux/macOS) and king.europe (windows).
    runs-on: ["self-hosted", "mobkit-temp-linux"]
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      CARGO_BAZEL_REPIN: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build + package all targets via BuildBuddy RBE
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"; VERSION="${VERSION//\//-}"
          hdr=(--remote_header=x-buildbuddy-api-key="${BUILDBUDDY_API_KEY}" --bes_header=x-buildbuddy-api-key="${BUILDBUDDY_API_KEY}")
          # target : .bazelrc RBE config : archive ext
          targets=(
            "x86_64-unknown-linux-gnu:buildbuddy-linux-rbe:tar.gz"
            "aarch64-unknown-linux-gnu:buildbuddy-linux-arm64-rbe:tar.gz"
            "aarch64-apple-darwin:buildbuddy-macos-rbe:tar.gz"
            "x86_64-apple-darwin:buildbuddy-macos-x86-rbe:tar.gz"
            "x86_64-pc-windows-msvc:buildbuddy-windows-rbe:zip"
          )
          mkdir -p dist logs

          # Build+package one target. Each target gets its OWN --output_base so the
          # five bazel servers run concurrently (one server serializes commands per
          # workspace). The compiles are remote, so the local runner just drives five
          # RBE clients in parallel; the targets fill the executor fleet during each
          # other's serial tails instead of building one-after-another. Combined with
          # opt-1 (see .bazelrc) this turns a ~7h serial build into ~one target's
          # wall-clock. opt-level lives in .bazelrc so build and cquery share the
          # exact same configuration (otherwise cquery resolves a different path).
          build_one() {
            local target="$1" cfg="$2" ext="$3"
            local ob="${HOME}/.cache/bazel-mob/${target}"
            local log="logs/${target}.log"
            local n=0
            # Retry the whole invocation: hosted RBE occasionally drops a task
            # ("stream closed with task still claimed") and fails after bazel's own
            # per-action retries; re-invoking resumes from cache and usually succeeds.
            until bb --output_base="${ob}" build --config="${cfg}" --compilation_mode=opt \
                --jobs=200 "${hdr[@]}" --remote_download_outputs=toplevel \
                //meerkat-mobkit:mobkit_gateway_bin >"${log}" 2>&1; do
              n=$((n+1))
              if [ "${n}" -ge 3 ]; then
                echo "::error::build ${target} failed after ${n} attempts"; tail -40 "${log}"; return 1
              fi
              echo "::warning::transient RBE failure on ${target}; retry ${n}/3"; sleep 20
            done
            # cquery returns a path relative to the execution root; with
            # --symlink_prefix=/ there is NO bazel-out convenience symlink in the
            # workspace, so the relative path doesn't resolve from cwd. Prepend the
            # execution root to get the real file (this was the v0.7.5 attach bug).
            local relbin execroot bin
            relbin=$(bb --output_base="${ob}" cquery --config="${cfg}" --compilation_mode=opt \
                "${hdr[@]}" --output=files //meerkat-mobkit:mobkit_gateway_bin 2>/dev/null | tail -1)
            execroot=$(bb --output_base="${ob}" info execution_root 2>/dev/null)
            bin="${execroot}/${relbin}"
            if [ -z "${relbin}" ] || [ ! -f "${bin}" ]; then
              echo "::error::missing binary for ${target}: '${bin}'"; tail -40 "${log}"; return 1
            fi
            local name="mobkit-gateway-${VERSION}-${target}.${ext}"
            if [ "${ext}" = "zip" ]; then
              # The self-hosted runner has no `zip`; build the archive with python.
              python3 -c 'import sys,os,zipfile; z=zipfile.ZipFile(sys.argv[2],"w",zipfile.ZIP_DEFLATED); z.write(sys.argv[1],arcname=os.path.basename(sys.argv[1])); z.close()' "${bin}" "${GITHUB_WORKSPACE}/dist/${name}"
            else
              tar -czf "dist/${name}" -C "$(dirname "${bin}")" "$(basename "${bin}")"
            fi
            echo "packaged dist/${name} ($(du -h "dist/${name}" | cut -f1))"
          }

          pids=(); labels=()
          for entry in "${targets[@]}"; do
            IFS=: read -r target cfg ext <<< "$entry"
            echo "launching ${target} (${cfg})"
            build_one "${target}" "${cfg}" "${ext}" &
            pids+=("$!"); labels+=("${target}")
            # Small stagger so the five crate_universe repins don't all start cold at
            # the same instant (the first warms the shared cargo cache for the rest).
            sleep 8
          done

          # Ship whatever succeeded — a single flaky target (e.g. windows on the
          # separate king.europe instance) must not throw away the other binaries.
          ok=0; failed=""
          for i in "${!pids[@]}"; do
            if wait "${pids[$i]}"; then
              echo "OK ${labels[$i]}"; ok=$((ok+1))
            else
              echo "::error::FAILED ${labels[$i]}"; failed="${failed} ${labels[$i]}"
            fi
          done
          echo "=== dist ==="; ls -la dist/ || true
          [ -n "${failed}" ] && echo "::warning::targets failed:${failed} — shipping the ${ok} that succeeded"
          [ "${ok}" -ge 1 ] || { echo "::error::all targets failed"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobkit-gateway-binaries
          path: dist/*
          if-no-files-found: error

  publish_github_release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    needs: [build_binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Build checksum manifest
        working-directory: release-artifacts
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) | sort > manifest_files.txt
          if [[ ! -s manifest_files.txt ]]; then
            echo "No release artifacts found" >&2
            exit 1
          fi
          xargs sha256sum < manifest_files.txt > checksums.sha256
          python3 - <<'PY'
          import os
          import json
          from pathlib import Path

          paths = [
              p.as_posix().lstrip("./")
              for p in sorted(Path(".").rglob("*"))
              if p.is_file() and (p.name.endswith(".tar.gz") or p.name.endswith(".zip"))
          ]

          tag = os.environ["RELEASE_TAG"]
          manifest = {
              "version": tag.lstrip("v"),
              "tag": tag,
              "artifacts": paths,
              "checksums": "checksums.sha256",
          }

          with open("index.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          PY

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
            release-artifacts/checksums.sha256
            release-artifacts/index.json
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true

  publish_registries:
    name: Publish crate + SDK packages
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release_packages == 'true')
    needs: [release_validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install Python + Node tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python publishing tools
        run: python -m pip install --upgrade build twine

      - name: Publish Rust crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.registry_dry_run == 'true' }}"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Running cargo publish in dry-run mode"
            scripts/repo-cargo publish -p meerkat-mobkit --locked --dry-run
          else
            echo "Publishing meerkat-mobkit to crates.io"
            output=$(scripts/repo-cargo publish -p meerkat-mobkit --locked 2>&1) && true
            rc=$?
            if [[ $rc -eq 0 ]]; then
              echo "  meerkat-mobkit: published"
            elif echo "$output" | grep -q "already exists\|already uploaded"; then
              echo "  meerkat-mobkit: already published, skipping"
            else
              echo "$output" >&2
              exit $rc
            fi
          fi

      - name: Publish Python SDK
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        working-directory: sdk/python
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.registry_dry_run == 'true' }}"
          python -m pip install --upgrade build twine
          rm -rf dist
          python -m build
          python -m twine check dist/*
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Python SDK dry-run: skipping upload"
          else
            python -m twine upload --skip-existing dist/*
          fi

      - name: Publish TypeScript SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.registry_dry_run == 'true' }}"
          npm install --ignore-scripts
          npm config set //registry.npmjs.org/:_authToken ${NODE_AUTH_TOKEN}
          npm run build
          if [[ "$DRY_RUN" == "true" ]]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
