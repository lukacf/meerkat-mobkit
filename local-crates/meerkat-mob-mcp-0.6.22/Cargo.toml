[dependencies.serde]
version = "1.0"
features = [
    "derive",
    "rc",
    "derive",
]

[dependencies.serde_json]
version = "1.0"
features = ["raw_value"]

[dependencies.thiserror]
version = "2.0"

[dependencies.tracing]
version = "0.1"

