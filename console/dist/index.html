<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="mobkit-base-url" content="" />
    <title>Meerkat Console</title>
    <style>
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #f7f7f3 0%, #eef1ed 100%);
        color: #143136;
      }

      #root {
        min-height: 100vh;
        padding: 18px;
      }

      [data-testid="meerkat-console"] {
        display: grid;
        gap: 16px;
      }

      .mc-workbench {
        display: grid;
        gap: 16px;
        grid-template-columns: minmax(240px, 320px) minmax(320px, 1fr);
        min-height: min(76vh, 880px);
      }

      .mc-workbench__sidebar,
      .mc-workbench__main,
      [data-testid="activity-panel"],
      [data-testid="topology-panel"],
      [data-testid="health-overview"] {
        border: 1px solid #c4d2cc;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 10px 32px rgba(18, 48, 50, 0.08);
      }

      .mc-workbench__sidebar,
      .mc-workbench__main {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      .mc-sidebar {
        height: 100%;
        display: grid;
        align-content: start;
        gap: 18px;
        padding: 16px;
      }

      .mc-sidebar__block {
        display: grid;
        gap: 12px;
      }

      .mc-sidebar__block-title,
      .mc-sidebar__section-title,
      .mc-composer__eyebrow {
        color: #53666a;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }

      .mc-sidebar__sections,
      .mc-sidebar__items {
        display: grid;
        gap: 8px;
      }

      .mc-sidebar__section {
        display: grid;
        gap: 10px;
      }

      .mc-sidebar__item {
        width: 100%;
        min-width: 0;
        border: 1px solid transparent;
        border-radius: 14px;
        background: #f5f7f4;
        color: #16353a;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        text-align: left;
      }

      .mc-sidebar__item:hover,
      .mc-sidebar__item.is-selected {
        background: #e8eeea;
        border-color: #d5e0db;
      }

      .mc-sidebar__item-copy {
        min-width: 0;
        display: grid;
        gap: 2px;
      }

      .mc-sidebar__item-title {
        font-size: 14px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mc-sidebar__item-subtitle {
        color: #61757a;
        font-size: 12px;
      }

      .mc-sidebar__item-meta {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }

      .mc-sidebar__meta {
        color: #5d7074;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }

      .mc-sidebar__meta.is-accent {
        color: #17653d;
      }

      .mc-conversation {
        height: 100%;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
      }

      .mc-conversation__header {
        padding: 18px 20px 0;
      }

      .mc-conversation__title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .mc-conversation__body {
        min-height: 0;
        overflow: auto;
        padding: 18px 20px;
      }

      [data-testid="chat-events"] {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 14px;
      }

      .mc-conversation__group {
        display: grid;
        gap: 6px;
      }

      .mc-conversation__group-label {
        color: #556a6e;
        font-size: 12px;
        font-weight: 600;
      }

      .mc-conversation__messages {
        display: grid;
        gap: 8px;
      }

      .mc-conversation__message {
        max-width: min(72ch, 100%);
        border-radius: 16px;
        background: #eef3f0;
        padding: 12px 14px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .mc-conversation__group.is-user {
        justify-items: end;
      }

      .mc-conversation__group.is-user .mc-conversation__message {
        background: #17353a;
        color: #f7fbfa;
      }

      .mc-conversation__group.is-system .mc-conversation__message {
        background: #f6f1e8;
      }

      .mc-conversation__empty {
        display: grid;
        gap: 8px;
        place-content: center;
        min-height: 100%;
        text-align: center;
        color: #5c6f74;
      }

      .mc-conversation__empty-title {
        color: #1b363b;
        font-size: 24px;
        font-weight: 700;
      }

      .mc-conversation__footer {
        padding: 0 20px 20px;
      }

      [data-testid="chat-form"] {
        display: grid;
        gap: 12px;
        border: 1px solid #d6e0db;
        border-radius: 16px;
        background: #f7faf8;
        padding: 14px;
      }

      .mc-composer__header {
        display: grid;
        gap: 4px;
      }

      .mc-composer__target {
        color: #17353a;
        font-size: 15px;
        font-weight: 600;
      }

      .mc-composer__field {
        display: grid;
        gap: 8px;
      }

      .mc-composer__label {
        color: #556a6e;
        font-size: 12px;
        font-weight: 600;
      }

      .mc-composer__actions {
        display: flex;
        justify-content: flex-end;
      }

      .mc-dashboard {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      [data-testid="activity-panel"],
      [data-testid="topology-panel"],
      [data-testid="health-overview"] {
        padding: 14px;
      }

      [data-testid="activity-feed"],
      [data-testid="topology-nodes"],
      [data-testid="health-loaded-modules"] {
        margin: 0;
        padding-left: 18px;
      }

      textarea,
      select,
      button {
        font: inherit;
      }

      textarea {
        min-height: 112px;
        resize: vertical;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        cursor: default;
        opacity: 0.5;
      }

      @media (max-width: 900px) {
        .mc-workbench,
        .mc-dashboard {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/console/assets/console-app.js" defer></script>
  </body>
</html>
